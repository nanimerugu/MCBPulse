name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcbpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mcbpulse?sslmode=disable&schema=public
      AUTH_SECRET: ci-only-secret-not-used-for-anything-real
      AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        # Postinstall scripts for prisma/@prisma/engines/esbuild/unrs-resolver
        # are gated by npm's install-scripts allowlist. The allowlist itself
        # (package.json's "allowScripts") is committed, so `npm ci` runs them
        # without any extra approval step here.

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed
        run: npm run db:seed

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
